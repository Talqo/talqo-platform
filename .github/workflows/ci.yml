name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: biomejs/setup-biome@v2
        with:
          version: "2.4.7"

      - name: Biome check
        run: biome ci .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: cd apps/web && bunx tsr generate

      - name: Type-check
        run: bun run type-check

      - name: Build all
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bunx turbo test --filter='!e2e'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pagepal
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pagepal
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load environment
        run: |
          grep -v '^#' .env.example | grep -v '^$' >> $GITHUB_ENV
          echo "POSTGRES_HOST=postgres" >> $GITHUB_ENV
          echo "APP_URL=http://localhost:4173" >> $GITHUB_ENV
          echo "BASE_URL=http://localhost:4173" >> $GITHUB_ENV

      - name: Install unzip
        run: apt-get update && apt-get install -y unzip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages and web app
        run: bunx turbo build --filter=web --filter=db

      - name: Run database migrations
        run: bun packages/db/migrate.ts

      - name: Seed database
        run: bun apps/api/src/db/seed.ts

      - name: Start API server
        run: bun apps/api/src/index.ts &

      - name: Start web preview
        run: cd apps/web && bun run preview &

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:4173; do sleep 2; done'

      - name: Run E2E tests
        run: cd apps/e2e && bun run test
