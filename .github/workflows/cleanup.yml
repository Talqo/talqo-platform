name: GHCR Cleanup

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Prune old GHCR images (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [pagepal-api, pagepal-web]
    steps:
      - uses: snok/container-retention-policy@v3.0.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ github.token }}
          image-names: ${{ matrix.package }}
          image-tags: "sha-*"
          tag-selection: tagged
          cut-off: 2w
          keep-n-most-recent: 5
