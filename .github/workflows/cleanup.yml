name: GHCR Cleanup

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Prune old GHCR sha tags (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [pagepal-api, pagepal-web]
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1.2.1
        with:
          owner: pagepal-agent
          package: ${{ matrix.package }}
          delete-tags: ^sha-.+
          exclude-tags: ^v?[0-9]+\.[0-9]+\.[0-9]+$
          keep-n-tagged: 5
          use-regex: true
