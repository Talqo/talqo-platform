<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PagePal - AI Chat Widget</title>
    <script>
      // Initialize theme before page load to prevent flash
      (() => {
        const savedTheme = localStorage.getItem("theme") || "light";
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- AI Chat Widget (dogfooding our embeddable widget) -->
    <script>
      window.__AI_WIDGET_CONFIG__ = {
        clientId: "demo-client",
        position: "right",
        defaultOpen: false,
        colors: {
          primary: "hsl(142 76% 36%)",      // Our green theme
          bgPrimary: "#ffffff",
          bgSecondary: "hsl(240 5% 96%)",
          textPrimary: "hsl(240 6% 10%)",
          textSecondary: "hsl(240 4% 46%)",
          border: "hsl(240 6% 90%)"
        }
      };
    </script>
    <script async defer src="http://localhost:5174/widget-bundle.js"></script>
  </body>
</html>
