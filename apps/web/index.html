<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PagePal - AI Chat Widget</title>
    <script>
      // Initialize theme before page load to prevent flash
      (() => {
        const savedTheme = localStorage.getItem("theme") || "light";
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Widget embed for development testing -->
    <script>
      (() => {
        // Only load widget in development
        if (window.location.port === '5173' || window.location.hostname === 'localhost') {
          // Use a test client ID for development
          window.__AI_WIDGET_CONFIG__ = {
            clientId: 'dev-test-client-id',
            position: 'right',
            colors: {
              primary: 'hsl(142 76% 36%)',
              bgPrimary: '#ffffff',
              bgSecondary: 'hsl(240 5% 96%)',
              textPrimary: 'hsl(240 6% 10%)',
              textSecondary: 'hsl(240 4% 46%)',
              border: 'hsl(240 6% 90%)'
            }
          };

          // Load widget bundle from dev server dist folder
          const scriptSrc = 'http://localhost:5174/dist/widget-bundle.js';

          const script = document.createElement('script');
          script.src = scriptSrc;
          script.async = true;
          script.defer = true;
          script.crossOrigin = 'anonymous';
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
