<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PagePal - AI Chat Widget</title>
    <script>
      // Initialize theme before page load to prevent flash
      (() => {
        const savedTheme = localStorage.getItem("theme") || "light";
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Widget embed for development testing -->
    <script type="module">
      (() => {
        // Only load widget in development - check BOTH hostname AND port
        if (window.location.hostname === 'localhost' && window.location.port === '5173') {
          // Use a test widgetToken for development
          window.__PAGEPAL__ = {
            token: '00000000-0000-4000-8001-000000000010'
          };

          // Load widget bundle from dev server - Vite preview serves from root
          const scriptSrc = 'http://localhost:5174/widget-bundle.js';

          const script = document.createElement('script');
          script.src = scriptSrc;
          script.async = true;
          script.defer = true;
          script.crossOrigin = 'anonymous';
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
