<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Talqo is an embeddable AI chat widget for websites. Connect your knowledge bases, paste one snippet, and help visitors get answers instantly."
    />
    <meta name="theme-color" content="#15803d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Talqo - AI Chat Widget" />
    <meta
      property="og:description"
      content="Add an AI chat widget to your website, connect your knowledge bases, and help visitors get answers instantly."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Talqo - AI Chat Widget" />
    <meta
      name="twitter:description"
      content="Add an AI chat widget to your website, connect your knowledge bases, and help visitors get answers instantly."
    />
    <title>Talqo - AI Chat Widget</title>
    <style>
      #landing-shell {
        min-height: 100vh;
        background: #ffffff;
        color: #09090b;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      #landing-shell header {
        align-items: center;
        border-bottom: 1px solid #e4e4e7;
        display: flex;
        height: 4rem;
        justify-content: space-between;
        padding: 0 1.5rem;
      }

      #landing-shell main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 80rem;
        padding: 4rem 1.5rem 5rem;
      }

      #landing-shell h1 {
        font-size: clamp(3rem, 9vw, 6rem);
        font-weight: 900;
        letter-spacing: -0.06em;
        line-height: 0.95;
        margin: 0;
        max-width: 52rem;
        text-wrap: balance;
      }

      #landing-shell h1 span,
      #landing-shell .brand {
        color: #15803d;
      }

      #landing-shell p {
        color: #71717a;
        font-size: 1.25rem;
        line-height: 1.75;
        margin: 1.75rem 0 0;
        max-width: 42rem;
      }

      .dark #landing-shell {
        background: #09090b;
        color: #fafafa;
      }

      .dark #landing-shell header {
        border-bottom-color: #27272a;
      }

      .dark #landing-shell h1 span,
      .dark #landing-shell .brand {
        color: #22c55e;
      }

      .dark #landing-shell p {
        color: #a1a1aa;
      }
    </style>
    <script>
      // Initialize theme before page load to prevent flash
      (() => {
        const savedTheme = localStorage.getItem("theme") || "light";
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="landing-shell" aria-label="Talqo landing page preview">
        <header>
          <strong class="brand">Talqo</strong>
        </header>
        <main>
          <!-- Keep the shell hero copy in sync with landing.heroSection in public/locales/en/translation.json -->
          <h1>
            The AI chat widget <span>your website needs.</span>
          </h1>
          <p>
            Talqo gives your website a branded AI assistant that answers
            visitor questions using the right business context: products,
            policies, bookings, docs, and connected tools.
          </p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
