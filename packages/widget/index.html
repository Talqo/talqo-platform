<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Widget Development</title>
		<style>
			/* Simulate a third-party website */
			body {
				font-family: system-ui, sans-serif;
				padding: 2rem;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				color: white;
			}

			.mock-website {
				max-width: 800px;
				margin: 0 auto;
				background: white;
				color: #333;
				padding: 2rem;
				border-radius: 8px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			}

			.mock-website h1 {
				color: #333;
			}

			.mock-website p {
				line-height: 1.6;
				color: #666;
			}

			/* Verify widget styles don't leak */
			.test-button {
				background: #ff6b6b;
				color: white;
				padding: 0.5rem 1rem;
				border: none;
				border-radius: 4px;
				margin-top: 1rem;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="mock-website">
			<h1>Customer Website Simulator</h1>
			<p>
				This simulates a third-party website where the widget is embedded.
				The gradient background and purple styling here should not be affected by
				the widget's styles, and vice versa.
			</p>
			<button type="button" class="test-button">Test Button (should stay red)</button>
		</div>

		<!-- Widget Configuration -->
		<script>
			window.__AI_WIDGET_CONFIG__ = {
				clientId: "dev-client-123",
				position: "right",
				defaultOpen: false,
				colors: {
					primary: "#10b981",
					bgPrimary: "#f8fafc",
					bgSecondary: "#f1f5f9",
					textPrimary: "#1e293b",
					textSecondary: "#64748b",
					border: "#e2e8f0"
				},
			};
		</script>

		<!-- Load widget in dev mode -->
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
