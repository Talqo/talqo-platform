# Production defaults — deploy prod with no -f flag.
# Dev overrides are in values.dev.yaml.

api:
  replicaCount: 2
  image:
    repository: "ghcr.io/pagepal-agent/pagepal-api"
    tag: ""
    pullPolicy: "IfNotPresent"
  port: 3000
  # Widget rate limiting — max messages per IP per hour
  widgetRateLimitPerHour: 60
  # Max messages per conversation before user must start a new one
  widgetConversationMaxMessages: 50
  # Comma-separated trusted proxy IPs for X-Forwarded-For validation.
  # When the direct connection is from one of these IPs, X-Forwarded-For is read
  # to extract the real client IP for rate limiting. Private/internal IPs are auto-trusted.
  trustedProxyIps: ""
  # Default LLM provider used when a client has not configured their own (optional)
  defaultLlm:
    existingSecret: ""
    providerType: ""
    apiKey: ""
    model: ""
    embeddingModel: ""
    baseUrl: ""
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"

web:
  replicaCount: 2
  image:
    repository: "ghcr.io/pagepal-agent/pagepal-web"
    tag: ""
    pullPolicy: "IfNotPresent"
  port: 80
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

ingress:
  enabled: true
  className: "nginx"
  host: "pagepal.dyn.cloud.e-infra.cz"
  tls: true
  tlsSecretName: "pagepal-tls"
  clusterIssuer: "letsencrypt-prod"

postgresql:
  auth:
    username: "pagepal"
    database: "pagepal"
    existingSecret: ""
  primary:
    persistence:
      size: "10Gi"
    initdb:
      scripts:
        # pgvector requires superuser to install; pre-create it here
        create_extensions.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;

minio:
  mode: "standalone"
  rootUser: "pagepal"
  rootPassword: ""
  existingSecret: ""
  buckets:
    - name: "pagepal-files"
      policy: none
      purge: false
  persistence:
    size: "10Gi"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  # Security contexts required by the cluster's restricted PodSecurity policy.
  securityContext:
    enabled: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  # Job that creates buckets/users after install — needs matching security context.
  postJob:
    securityContext:
      enabled: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  # Disable default console user — root user has full access.
  users: []
  # All job types need identical security contexts (cluster enforces rootless containers).
  makeBucketJob:
    securityContext:
      enabled: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
  makeUserJob:
    securityContext:
      enabled: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
  makePolicyJob:
    securityContext:
      enabled: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
  customCommandJob:
    securityContext:
      enabled: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
  makeServiceAccountJob:
    securityContext:
      enabled: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false

jwt:
  existingSecret: ""

resend:
  existingSecret: ""

providerKey:
  existingSecret: ""

migration:
  enabled: true
  image:
    repository: "ghcr.io/pagepal-agent/pagepal-api"
    tag: ""
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
