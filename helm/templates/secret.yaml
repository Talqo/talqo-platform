{{- if not .Values.jwt.existingSecret }}
{{- if not (lookup "v1" "Secret" .Release.Namespace (include "pagepal.jwtSecretName" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pagepal.jwtSecretName" . }}
  labels:
    {{- include "pagepal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  secret: {{ randAlphaNum 64 }}
{{- end }}
{{- end }}
---
{{- if not .Values.resend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pagepal.resendSecretName" . }}
  labels:
    {{- include "pagepal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  apiKey: {{ required "resend.apiKey is required" .Values.resend.apiKey | quote }}
{{- end }}
---
{{- if not .Values.providerKey.existingSecret }}
{{- if not (lookup "v1" "Secret" .Release.Namespace (include "pagepal.providerKeySecretName" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pagepal.providerKeySecretName" . }}
  labels:
    {{- include "pagepal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  # sha256sum of 32 random bytes → 64 lowercase hex chars (valid AES-256-GCM key)
  secret: {{ randBytes 32 | sha256sum }}
{{- end }}
{{- end }}
---
{{- if not .Values.api.defaultLlm.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pagepal.defaultLlmSecretName" . }}
  labels:
    {{- include "pagepal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  providerType: {{ required "api.defaultLlm.providerType is required" .Values.api.defaultLlm.providerType | quote }}
  apiKey: {{ required "api.defaultLlm.apiKey is required" .Values.api.defaultLlm.apiKey | quote }}
  model: {{ required "api.defaultLlm.model is required" .Values.api.defaultLlm.model | quote }}
  embeddingModel: {{ .Values.api.defaultLlm.embeddingModel | default "" | quote }}
  baseUrl: {{ .Values.api.defaultLlm.baseUrl | default "" | quote }}
{{- end }}
