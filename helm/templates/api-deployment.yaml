apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pagepal.fullname" . }}-api
  labels:
    {{- include "pagepal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "pagepal.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pagepal.api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ required "api.image.tag is required — pass --set api.image.tag=<version>" .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagepal.dbSecretName" . }}
                  key: password
            - name: POSTGRES_HOST
              value: {{ printf "%s-postgresql" (include "pagepal.fullname" .) | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagepal.jwtSecretName" . }}
                  key: secret
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagepal.minioSecretName" . }}
                  key: rootUser
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagepal.minioSecretName" . }}
                  key: rootPassword
            - name: S3_ENDPOINT
              value: "http://{{ include "pagepal.fullname" . }}-minio:9000"
            - name: S3_BUCKET
              value: {{ (index .Values.minio.buckets 0).name | quote }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagepal.resendSecretName" . }}
                  key: apiKey
            - name: APP_URL
              value: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls) .Values.ingress.host | quote }}
            - name: PROVIDER_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagepal.providerKeySecretName" . }}
                  key: secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
